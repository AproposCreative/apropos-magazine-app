name: Local source verification

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated logic tests
        run: bash scripts/verify-local.sh checks
      - name: Backup tool and iOS preflight tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  ios:
    needs: backend
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      npm_config_ignore_scripts: 'true'
      APROPOS_CRASHLYTICS_UPLOAD: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hermetic unsigned iPhone tests with reviewed package pins
        env:
          APROPOS_XCRESULT_PATH: ${{ runner.temp }}/AproposNative.xcresult
        run: bash scripts/verify-ios-ci.sh
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AproposNative-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/AproposNative.xcresult
            ${{ runner.temp }}/AproposNative.xcresult.summary.json
          if-no-files-found: warn
          retention-days: 7
