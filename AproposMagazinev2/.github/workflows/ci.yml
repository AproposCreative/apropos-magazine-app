name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run unit tests
        env:
          WORKSPACE: AproposMagazinev2.xcodeproj
          SCHEME: AproposMagazinev2
        run: Scripts/run-tests.sh
